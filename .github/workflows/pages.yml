name: Pages

# Builds the live dashboard in site/ from the committed markdown (study map, preregistration, units, review)
# and publishes it to GitHub Pages. The build fails if the known-answer check in site/src/lab.check.mjs fails.
on:
  push:
    branches: [main]
    paths: ['site/**', 'units/**', 'docs/**', 'STUDY-MAP.md', 'PREREGISTRATION.md', 'README.md', 'SPEC.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
